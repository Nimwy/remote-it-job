# Nginx — reverse proxy + HTTPS cho devremote.cc.
# Trên VPS: /etc/nginx/sites-available/remoteit (symlink ở sites-enabled/remoteit).
# Lấy từ VPS ngày 2026-09-22; khác bản đang chạy đúng 1 chỗ, đánh dấu [THAY ĐỔI].
#
# Cài / cập nhật (chạy tay, xem DEPLOYMENT.md § Cài đặt server):
#   sudo install -m 644 deploy/nginx/devremote.cc.conf /etc/nginx/sites-available/remoteit
#   sudo nginx -t && sudo systemctl reload nginx     # KHÔNG reload nếu nginx -t lỗi
#
# Các dòng "managed by Certbot" do `certbot --nginx` chèn (renewal dùng authenticator/installer
# nginx). Giữ nguyên các dòng đó khi sửa file.

server {
    server_name devremote.cc;

    client_max_body_size 10m;

    # API -> FastAPI. proxy_pass KHÔNG có "/" ở cuối: giữ nguyên prefix /api.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # [THAY ĐỔI] bản đang chạy: $proxy_add_x_forwarded_for (nối thêm vào header client gửi,
        # client có thể chèn IP giả). Ghi đè bằng IP thật -> rate limit theo đúng người dùng.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Còn lại -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devremote.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devremote.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = devremote.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name devremote.cc;
    return 404; # managed by Certbot


}
