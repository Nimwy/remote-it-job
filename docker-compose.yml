services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remoteit
      POSTGRES_PASSWORD: remoteit
      POSTGRES_DB: remoteit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteit"]
      interval: 3s
      retries: 5

  backend:
    build: ./backend
    user: "1000:1000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    # Giá trị dev/e2e — KHÔNG phải secret, không dùng cho production.
    environment: &backend-env
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: remoteit
      DB_USER: remoteit
      DB_PASSWORD: remoteit
      SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: admin@remoteit.vn
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Backend cô lập cho e2e (T-04): DB riêng remoteit_e2e, port 8001.
  # Khởi động: docker compose up -d backend-e2e
  # Lệnh này tự tạo DB, dựng schema bằng metadata.create_all (KHÔNG qua Alembic —
  # migration được kiểm tra riêng ở CI) rồi seed dữ liệu demo idempotent.
  backend-e2e:
    build: ./backend
    user: "1000:1000"
    command: sh -c "python -m scripts.e2e_prepare && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    environment:
      <<: *backend-env
      DB_NAME: remoteit_e2e
      SECRET_KEY: e2e-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:3100", "http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
