services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remoteit
      POSTGRES_PASSWORD: remoteit
      POSTGRES_DB: remoteit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteit"]
      interval: 3s
      retries: 5

  backend:
    build: ./backend
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://remoteit:remoteit@db:5432/remoteit
      SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
