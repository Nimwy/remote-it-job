name: CI

on:
  pull_request:
    branches: [main]

# Chỉ cần đọc mã nguồn — least privilege.
permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest

    # Postgres cho unit test, map ra cổng 5433 để không đụng cổng 5432
    # mà docker compose (dùng cho e2e) sẽ chiếm.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remoteit
          POSTGRES_PASSWORD: remoteit
          POSTGRES_DB: remoteit_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U remoteit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://remoteit:remoteit@localhost:5433/remoteit_test

    steps:
      - uses: actions/checkout@v4

      # ---------- Backend ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Pytest
        working-directory: backend
        run: pytest -q

      # ---------- Frontend ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      # ---------- E2E ----------
      - name: Build backend-e2e image
        run: docker compose build backend-e2e

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        run: npm run test:e2e
