name: CI

on:
  pull_request:
    branches: [main]

# Chỉ cần đọc mã nguồn — least privilege.
permissions:
  contents: read

# Push liên tiếp vào cùng PR -> huỷ lần chạy cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Postgres cho unit test, map ra cổng 5433 để không đụng cổng 5432
    # mà docker compose (dùng cho e2e) sẽ chiếm.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remoteit
          POSTGRES_PASSWORD: remoteit
          POSTGRES_DB: remoteit_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U remoteit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Giá trị test — KHÔNG phải secret (repo public, PR từ fork không được cấp secret).
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://remoteit:remoteit@localhost:5433/remoteit_test
      # DB riêng cho bước kiểm tra migration
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: remoteit_migrate
      DB_USER: remoteit
      DB_PASSWORD: remoteit
      SECRET_KEY: ci-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: admin@remoteit.vn
      ADMIN_PASSWORD: admin123

    steps:
      - uses: actions/checkout@v5

      # ---------- Backend ----------
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff
        working-directory: backend
        run: ruff check .

      # Migration chỉ chạy thật ở production -> kiểm tra ở đây trên DB trống:
      # upgrade -> model khớp migration -> downgrade -> upgrade lại.
      - name: Alembic migrations
        working-directory: backend
        run: |
          PGPASSWORD=remoteit psql -h localhost -p 5433 -U remoteit -d remoteit_test \
            -c "CREATE DATABASE remoteit_migrate"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Pytest
        working-directory: backend
        run: pytest -q

      # ---------- Frontend ----------
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # BACKEND_URL bị cố định vào rewrites lúc build -> trỏ backend-e2e để e2e dùng luôn bản build này
      - name: Build
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8001
        run: npm run build

      # ---------- E2E ----------
      - name: Build backend-e2e image
        run: docker compose build backend-e2e

      # Pre-start backend-e2e để Playwright reuseExistingServer (nếu không,
      # webServer `docker compose up -d` thoát ngay -> "exited early").
      - name: Start backend-e2e and wait
        run: |
          docker compose up -d backend-e2e
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8001/api/health >/dev/null 2>&1; then
              echo "backend-e2e ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8001/api/health >/dev/null || { docker compose logs backend-e2e; exit 1; }

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # CI=true -> playwright.config.ts chạy `next start` (bản build ở trên), không phải next dev
      - name: E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
